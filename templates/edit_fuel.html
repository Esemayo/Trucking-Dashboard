<!DOCTYPE html>
<html>
<head>
    <h1>Edit Fuel</h1>
    <style>
    body {
        background: #111827;
        color: white;
        font-family: Arial, sans-serif;
        padding: 40px;
    }
    .form-layout {
        display: flex;
        gap: 40px;
        align-items: flex-start;

    }
    .error-message {
        color: red;
        font-weight: bold;
        max-width: 300px;
    }
    .success-message {
        color: green;
        font-weight: bold;
        max-width: 300px;
    }
</style>
<body>
    <div class="form-layout">
    <form method="POST" action="{{ url_for('edit_fuel', fuel_id=fuel_id) }}">
    <label for="purchase_date">Purchase Date</label>
        <input type="purchase_date" id="purchase_date" name="purchase_date" required value="{{ form_data.get('purchase_date', fuel[0]) }}">

        <br><br>

        <label for="gallons">Gallons</label>
        <input type="number" id="gallons" name="gallons" step="0.1" min="0" required value="{{ form_data.get('gallons', fuel[1]) }}">

        <br><br>

        <label for="total_cost">Total Cost</label>
        <input type="number" id="total_cost" name="total_cost" step="0.01" min="0" required value="{{ form_data.get('total_cost', fuel[2]) }}">

        <br><br>
        <label for="odometer">Odometer</label>
        <input type="number" id="odometer" name="odometer" step="0.01" min="0" required value="{{ form_data.get('odometer', fuel[3]) }}">

        <br><br>
    <button type="submit">Save Changes</button>
    <br>
    <a href="{{ url_for('home') }}">Back to Dashboard</a>
    </form>
        <div class="message-section">
        <div class="error-message">
            {% if errors %}
            <h3>🚨 Please Fix the Following: </h3>
                {% for error in errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            {% endif %}
        </div>
    </div>
</body>
