<!DOCTYPE html>
<html>
  <body>
    <h1>Add Fuel Purchase</h1>

    <form method="POST" action="{{ url_for('add_fuel') }}">
      <label for="purchase_date">Purchase Date</label>
      <input type="date" id="purchase_date" name="purchase_date" required>

      <br><br>

      <label for="gallons">Gallons</label>
      <input type="number" id="gallons" name="gallons" step="0.001" min="0" required>

      <br><br>

      <label for="total_cost">Total Cost</label>
      <input type="number" id="total_cost" name="total_cost" step="0.01" min="0" required>

      <br><br>

      <label for="odometer">Odometer</label>
      <input type="number" id="odometer" name="odometer" step="1" min="0" required>

      <br><br>

      <button type="submit">Add Fuel</button>
    </form>

    <br>

    <a href="{{ url_for('home') }}">Back to Dashboard</a>
  </body>
</html>
