<!DOCTYPE html>
<html>
<head>
    <title>Add Load</title>
</head>
<body>
    <h1>Add New Load</h1>

    <form method="POST" action="{{ url_for('add_load') }}">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" required value="{{ form_data['date'] }}">

        <br><br>

        <label for="load_type">Load Type</label>
        <select id="load_type" name="load_type" required>
            <option value="">Select load type</option>
            <option value="scrap">Scrap</option>
            <option value="rebar">Rebar</option>
            <option value="container">Container</option>
        </select>

        <br><br>

        <label for="miles">Miles</label>
        <input type="number" id="miles" name="miles" step="0.1" min="0" required value="{{ form_data['miles'] }}">

        <br><br>

        <label for="rate">Rate</label>
        <input type="number" id="rate" name="rate" step="0.01" min="0" required value="{{ form_data['rate'] }}">

        <br><br>
        

        <button type="submit">Add Load</button>
    </form>

    <br>

    <a href="{{ url_for('home') }}">Back to Dashboard</a>
</body>
</html>
